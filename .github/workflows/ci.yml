name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm format

  agent:
    name: Go Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agents/go-agent/go.mod
          cache-dependency-path: agents/go-agent/go.sum

      - name: build
        run: go build ./...
        working-directory: agents/go-agent

      - name: vet
        run: go vet ./...
        working-directory: agents/go-agent
